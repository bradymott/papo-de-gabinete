<title>Papo de Gabinete</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, one scrolling column (max 680px), fixed bottom tab bar;
   conversation / lesson / drill / review open as full-screen sheets. Azulejo tiles (Athos Bulcão, Brasília) as the motif. */
:root {
  --bg: #EDF1F7;
  --surface: #FFFFFF;
  --surface-2: #F5F7FB;
  --ink: #0E1C33;
  --muted: #55647A;
  --faint: #8794A8;
  --line: #D6DEEA;
  --azul: #1D4C9E;
  --azul-deep: #143772;
  --azul-soft: #DFE8F7;
  --on-azul: #FFFFFF;
  --ipe: #E9A400;
  --ipe-soft: #FCEFC8;
  --ipe-ink: #5A3E00;
  --good: #0F7A4C;
  --good-soft: #DCF2E6;
  --bad: #C2352B;
  --bad-soft: #FBE2DF;
  --warn: #A85F00;
  --warn-soft: #FBEACF;
  --scrim: rgba(14, 28, 51, .42);
  --shadow: 0 1px 2px rgba(14,28,51,.06), 0 8px 24px rgba(14,28,51,.07);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", -apple-system, "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r-lg: 18px;
  --r-md: 12px;
  --r-sm: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0A1120; --surface: #121B2D; --surface-2: #0E1626; --ink: #E7EDF7; --muted: #9AA9C0; --faint: #6D7C93; --line: #24324B;
    --azul: #7DA3F5; --azul-deep: #A9C3FA; --azul-soft: #1A2A4A; --on-azul: #0A1120;
    --ipe: #FFC23D; --ipe-soft: #3A2C08; --ipe-ink: #FFE4A3;
    --good: #45CF8E; --good-soft: #0F2C20; --bad: #FF8073; --bad-soft: #351817; --warn: #FFB34D; --warn-soft: #33240C;
    --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0A1120; --surface: #121B2D; --surface-2: #0E1626; --ink: #E7EDF7; --muted: #9AA9C0; --faint: #6D7C93; --line: #24324B;
  --azul: #7DA3F5; --azul-deep: #A9C3FA; --azul-soft: #1A2A4A; --on-azul: #0A1120;
  --ipe: #FFC23D; --ipe-soft: #3A2C08; --ipe-ink: #FFE4A3;
  --good: #45CF8E; --good-soft: #0F2C20; --bad: #FF8073; --bad-soft: #351817; --warn: #FFB34D; --warn-soft: #33240C;
  --scrim: rgba(0,0,0,.6); --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2.5px solid var(--azul); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: -0.01em; text-wrap: balance; margin: 0; }
p { margin: 0; }
b, strong { font-weight: 700; }
s { color: var(--bad); }
.mono { font-family: var(--f-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
.muted { color: var(--muted); }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- app shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand > div:last-child { min-width: 0; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; overflow: hidden; flex: none; }
.brand-name { font-family: var(--f-display); font-weight: 800; font-size: 19px; letter-spacing: -0.02em; line-height: 1.05; }
.brand-name small { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--f-body); font-weight: 500; font-size: 11.5px; color: var(--muted); letter-spacing: 0; }
.chip-stat { display: inline-flex; align-items: center; gap: 5px; height: 30px; padding: 0 10px; border-radius: 999px; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }
.chip-streak { background: var(--ipe-soft); color: var(--ipe-ink); }
.chip-streak svg { color: var(--ipe); }
.chip-due { background: var(--azul-soft); color: var(--azul-deep); }

main#view { padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tabs .row { max-width: 680px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 9px 4px 8px; color: var(--faint); font-size: 11.5px; font-weight: 600; position: relative; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--azul); }
.tab[aria-current="page"]::after { content: ""; position: absolute; top: 0; left: 30%; right: 30%; height: 3px; border-radius: 0 0 3px 3px; background: var(--azul); }
.tab .badge { position: absolute; top: 5px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; font-weight: 700; }

/* ---------- common blocks ---------- */
.section { display: grid; gap: 12px; padding-top: 22px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
.section-head h2 { font-size: 21px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; }
.list { display: grid; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; font-weight: 700; font-size: 15.5px; transition: transform .08s ease, background .15s ease; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--azul); color: var(--on-azul); }
.btn-ghost { background: var(--surface); border: 1.5px solid var(--line); color: var(--ink); }
.btn-soft { background: var(--azul-soft); color: var(--azul-deep); }
.btn-ipe { background: var(--ipe); color: #241800; }
.btn-sm { min-height: 36px; padding: 0 13px; font-size: 14px; }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; flex: none; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 999px; display: inline-grid; place-items: center; color: var(--muted); flex: none; }
.icon-btn:active { background: var(--surface-2); }
.icon-btn svg { width: 22px; height: 22px; }
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 600; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.pill-azul { background: var(--azul-soft); color: var(--azul-deep); border-color: transparent; }
.pill-good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.pill-bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.pill-warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.pill-ipe { background: var(--ipe-soft); color: var(--ipe-ink); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { padding: 6px 13px; border-radius: 999px; font-size: 14px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.empty { text-align: center; padding: 26px 18px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty svg.tiles { width: 92px; height: 46px; }
.note { font-size: 13.5px; color: var(--muted); }
.banner { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-soft); color: var(--ink); font-size: 14px; }
.banner svg { flex: none; width: 20px; height: 20px; color: var(--warn); margin-top: 1px; }

/* ---------- home / scenarios ---------- */
.hero { position: relative; overflow: hidden; border-radius: 22px; background: var(--azul); color: var(--on-azul); padding: 18px 18px 16px; margin-top: 16px; display: grid; gap: 12px; }
.hero .tiles-bg { position: absolute; right: -10px; top: -10px; width: 190px; height: 190px; opacity: .22; color: var(--on-azul); pointer-events: none; }
.hero h1 { font-size: 27px; line-height: 1.08; position: relative; }
.hero p { position: relative; opacity: .9; font-size: 14.5px; max-width: 34ch; }
.hero-row { display: flex; align-items: center; gap: 14px; position: relative; flex-wrap: wrap; }
.goal { display: flex; align-items: center; gap: 10px; }
.goal svg { width: 46px; height: 46px; }
.goal b { font-size: 18px; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
.goal span { font-size: 12.5px; opacity: .85; }
.hero .btn { background: var(--on-azul); color: var(--azul); }
.scn { display: grid; grid-template-columns: 52px 1fr auto; gap: 12px; align-items: center; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px 12px 12px 12px; }
.scn:active { background: var(--surface-2); }
.scn-body { min-width: 0; display: grid; gap: 3px; }
.scn-title { font-family: var(--f-display); font-weight: 700; font-size: 16.5px; line-height: 1.2; }
.scn-sub { font-size: 13.5px; color: var(--muted); line-height: 1.3; }
.scn .chips { margin-top: 4px; }
.lvl { display: inline-flex; gap: 3px; }
.lvl i { width: 6px; height: 14px; border-radius: 2px; background: var(--line); display: block; }
.lvl i.on { background: var(--azul); }
.avatar { width: 52px; height: 52px; border-radius: 14px; overflow: hidden; position: relative; flex: none; background: var(--azul-soft); color: var(--azul); }
.avatar svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.avatar span { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 17px; color: var(--ink); }
.avatar span em { font-style: normal; background: var(--surface); border-radius: 7px; padding: 1px 5px; line-height: 1.2; }
.avatar.sm { width: 34px; height: 34px; border-radius: 10px; }
.avatar.sm span { font-size: 12px; }
.avatar.lg { width: 76px; height: 76px; border-radius: 20px; }
.avatar.lg span { font-size: 22px; }
.setup { display: grid; gap: 14px; border-color: var(--ipe); background: linear-gradient(0deg, var(--surface), var(--surface)); }
.setup ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 14px; counter-reset: s; }
.setup li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; counter-increment: s; }
.setup li::before { content: counter(s); width: 26px; height: 26px; border-radius: 50%; background: var(--ipe-soft); color: var(--ipe-ink); font-weight: 800; display: grid; place-items: center; font-size: 13px; }
.setup li > div { display: grid; gap: 7px; min-width: 0; }
details.howto summary { cursor: pointer; color: var(--azul); font-weight: 600; font-size: 14px; list-style: none; }
details.howto summary::-webkit-details-marker { display: none; }
details.howto ol { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; color: var(--muted); list-style: decimal; counter-reset: none; }
details.howto ol li { display: list-item; }
details.howto ol li::before { content: none; }

/* ---------- full-screen sheets ---------- */
.screen { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); animation: slideUp .22s ease-out; }
@keyframes slideUp { from { transform: translateY(18px); opacity: .4; } to { transform: none; opacity: 1; } }
.screen-head { background: var(--surface); border-bottom: 1px solid var(--line); flex: none; }
.screen-head .wrap { display: flex; align-items: center; gap: 8px; padding-block: 8px; min-height: 56px; }
.screen-head .ttl { flex: 1; min-width: 0; display: grid; }
.screen-head .ttl b { font-family: var(--f-display); font-size: 17px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen-head .ttl small { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.screen-body { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
.screen-body > .wrap { padding-block: 16px 28px; display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.screen-foot { flex: none; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.screen-foot .wrap { padding-block: 10px; display: grid; gap: 8px; }
.progress { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; flex: 1; }
.progress i { display: block; height: 100%; background: var(--azul); border-radius: 4px; transition: width .3s ease; }

/* ---------- conversation ---------- */
.msgs { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
.msg { display: grid; gap: 6px; max-width: 100%; }
.msg-npc { grid-template-columns: 34px minmax(0, 1fr); align-items: start; column-gap: 8px; }
.bubble { border-radius: 18px; padding: 11px 14px; font-size: 16.5px; line-height: 1.45; overflow-wrap: anywhere; }
.msg-npc .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 6px; }
.msg-me { justify-items: end; grid-template-columns: minmax(0, 1fr); }
.msg-me .bubble { background: var(--azul); color: var(--on-azul); border-bottom-right-radius: 6px; max-width: 88%; }
.bubble .txt.hidden { filter: blur(6px); user-select: none; cursor: pointer; }
.bubble-tools { display: flex; align-items: center; gap: 2px; margin: 6px -6px -4px; flex-wrap: wrap; }
.tool { display: inline-flex; align-items: center; gap: 5px; height: 32px; padding: 0 9px; border-radius: 999px; font-size: 13px; font-weight: 600; color: var(--azul); }
.tool:active { background: var(--azul-soft); }
.tool svg { width: 18px; height: 18px; }
.tool.playing svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.en-line { font-size: 14px; color: var(--muted); font-style: italic; margin-top: 4px; }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); animation: dot 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 0%, 60%, 100% { opacity: .3; transform: none; } 30% { opacity: 1; transform: translateY(-3px); } }

.coach { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px; display: grid; gap: 12px; }
.coach-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.coach-head .mono { color: var(--muted); }
.score { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; padding: 3px 10px; border-radius: 999px; font-variant-numeric: tabular-nums; }
.score.good { background: var(--good-soft); color: var(--good); }
.score.mid { background: var(--warn-soft); color: var(--warn); }
.score.low { background: var(--bad-soft); color: var(--bad); }
.fixline { font-size: 16px; line-height: 1.55; }
.fixline del { color: var(--bad); text-decoration-thickness: 2px; background: var(--bad-soft); border-radius: 4px; padding: 0 2px; }
.fixline ins { color: var(--good); text-decoration: none; background: var(--good-soft); border-radius: 4px; padding: 0 2px; font-weight: 700; }
.lbl { font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.natural { background: var(--azul-soft); border-radius: var(--r-md); padding: 10px 12px; display: grid; gap: 2px; }
.natural p { font-size: 15.5px; }
.err { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 7px; }
.err-head { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.err-swap { font-size: 16px; }
.err-swap s { text-decoration-thickness: 2px; }
.err-swap b { color: var(--good); }
.err-why { font-size: 14.5px; color: var(--ink); }
.rule { background: var(--surface-2); border: 1px dashed var(--line); border-radius: var(--r-md); padding: 10px 12px 10px 12px; }
.rule summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--azul); list-style: none; display: flex; align-items: center; gap: 6px; }
.rule summary::-webkit-details-marker { display: none; }
.rule ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.err-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.nudge { background: var(--ipe-soft); color: var(--ink); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; font-size: 14.5px; }
.cards-added { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.cards-added svg { width: 16px; height: 16px; }
.skeleton { display: grid; gap: 8px; }
.skeleton i { display: block; height: 12px; border-radius: 6px; background: linear-gradient(90deg, var(--line), var(--surface-2), var(--line)); background-size: 200% 100%; animation: shimmer 1.3s linear infinite; }
@keyframes shimmer { to { background-position: -200% 0; } }
.composer { display: grid; gap: 6px; }
.composer-row { display: flex; gap: 8px; align-items: flex-end; }
.composer textarea { flex: 1; min-width: 0; resize: none; min-height: 48px; max-height: 160px; padding: 12px 14px; border-radius: 22px; border: 1.5px solid var(--line); background: var(--surface-2); font-size: 16.5px; line-height: 1.35; }
.composer textarea:focus { outline: none; border-color: var(--azul); background: var(--surface); }
.send { width: 48px; height: 48px; border-radius: 50%; background: var(--azul); color: var(--on-azul); display: grid; place-items: center; flex: none; }
.send svg { width: 22px; height: 22px; }
.send[disabled] { opacity: .4; }
.dictate-hint { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.dictate-hint svg { width: 15px; height: 15px; flex: none; }
.hint-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px; display: grid; gap: 8px; font-size: 14.5px; }
.hint-box .h-pt { font-weight: 600; }
.hint-box .h-en { color: var(--muted); font-size: 13.5px; }

/* ---------- lessons ---------- */
.lesson-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
.lesson-row:active { background: var(--surface-2); }
.lesson-row b { font-family: var(--f-display); font-size: 16px; display: block; line-height: 1.2; }
.lesson-row small { color: var(--muted); font-size: 13.5px; display: block; line-height: 1.3; margin-top: 2px; }
.lesson-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.plan-item { display: grid; grid-template-columns: 36px 1fr auto; gap: 12px; align-items: center; }
.plan-rank { width: 34px; height: 34px; border-radius: 10px; background: var(--ipe-soft); color: var(--ipe-ink); font-weight: 800; display: grid; place-items: center; font-family: var(--f-display); }
.lesson-body { display: grid; gap: 18px; }
.lesson-body h3 { font-size: 18px; margin-bottom: 6px; }
.lesson-body p, .lesson-body li { font-size: 15.5px; }
.lesson-body ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.core { background: var(--azul); color: var(--on-azul); border-radius: var(--r-lg); padding: 16px; display: grid; gap: 8px; position: relative; overflow: hidden; }
.core ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 15px; position: relative; }
.core .mono { opacity: .8; position: relative; }
.core s { color: inherit; opacity: .75; }
